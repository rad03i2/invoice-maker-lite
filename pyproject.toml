[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-maker-lite"
version = "1.0.0"
description = "A local-first CLI for creating, storing, exporting, and tracking professional invoices."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["invoice", "cli", "sqlite", "pdf", "billing"]
dependencies = []

[project.scripts]
invoice-maker = "invoice_maker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_maker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
