name: Bug report
description: Report reproducible Invoice Maker Lite behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use fictional invoice/customer data only. Never upload a real invoice database to a public issue.
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu / macOS"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "invoice-maker show INV-DEMO-001 --json"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have not included real customer data, invoice databases, or credentials.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
