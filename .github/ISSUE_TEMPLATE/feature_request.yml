name: Feature request
description: Propose a focused Invoice Maker Lite improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What invoicing workflow problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Does this change stored invoice data or schema?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: dropdown
    id: external
    attributes:
      label: Does this require network access or an external service?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Financial / privacy considerations
      description: Mention rounding, taxes, customer data, exports, or migration impact where relevant.
